name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  frontend-package:
    name: Frontend codec package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: vue/package-lock.json
      - name: Install
        run: npm ci
        working-directory: vue
      - name: Check
        run: npm run check && npm test
        working-directory: vue
      - name: Pack
        run: mkdir -p ../release && npm pack --pack-destination ../release
        working-directory: vue
      - name: Publish release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/*.tgz --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
